spring.application.name=fintrack
spring.datasource.url=jdbc:postgresql://${FINTRACKHOST}/${FINTRACKDBNAME}
spring.datasource.username=${FINTRACKUSER}
spring.datasource.password=${FINTRACKDBPW}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true

# JWT Configuration
jwt.secret=${FINTRACK_JWT_SECRET}
